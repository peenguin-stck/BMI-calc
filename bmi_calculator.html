
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .wrap { padding: 2rem 1rem; max-width: 480px; margin: 0 auto; }
  .title { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .sub { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 2rem; }
  .field { margin-bottom: 1.25rem; }
  .field label { display: block; font-size: 14px; color: var(--color-text-secondary); margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 14px; font-size: 16px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); outline: none; transition: border-color 0.15s; }
  .field input:focus { border-color: var(--color-border-primary); }
  .calc-btn { width: 100%; padding: 12px; font-size: 15px; font-weight: 500; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-primary); cursor: pointer; transition: background 0.15s, transform 0.1s; margin-top: 0.5rem; }
  .calc-btn:hover { background: var(--color-background-secondary); }
  .calc-btn:active { transform: scale(0.98); }
  .result-card { margin-top: 1.75rem; background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1.25rem 1.5rem; display: none; }
  .bmi-number { font-size: 48px; font-weight: 500; line-height: 1; margin-bottom: 4px; }
  .bmi-label { font-size: 16px; font-weight: 500; margin-bottom: 1rem; }
  .bar-track { height: 8px; border-radius: 4px; background: var(--color-border-tertiary); position: relative; margin-bottom: 0.5rem; overflow: visible; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .bar-marker { position: absolute; top: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-text-primary); border: 2px solid var(--color-background-primary); transform: translateX(-50%); transition: left 0.4s ease; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 1rem; }
  .detail-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--color-text-secondary); padding: 4px 0; border-top: 0.5px solid var(--color-border-tertiary); }
  .detail-row:first-child { border-top: none; }
</style>

<div class="wrap">
  <h2 class="sr-only" style="position:absolute;left:-9999px">BMI Calculator</h2>
  <p class="title">BMI Calculator</p>
  <p class="sub">Enter your height and weight to calculate your Body Mass Index.</p>

  <div class="field">
    <label for="height">Height (meters)</label>
    <input type="number" id="height" placeholder="e.g. 1.75" step="0.01" min="0.5" max="3" />
  </div>
  <div class="field">
    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" placeholder="e.g. 70" step="0.1" min="10" max="500" />
  </div>
  <button class="calc-btn" onclick="calcBMI()">Calculate BMI</button>

  <div class="result-card" id="result">
    <div class="bmi-number" id="bmi-num">—</div>
    <div class="bmi-label" id="bmi-label">—</div>
    <div class="bar-track">
      <div class="bar-fill" id="bar-fill" style="width:0%"></div>
      <div class="bar-marker" id="bar-marker" style="left:0%"></div>
    </div>
    <div class="bar-labels">
      <span>Underweight</span><span>Normal</span><span>Overweight</span><span>Obese</span>
    </div>
    <div id="details"></div>
  </div>
</div>

<script>
function calcBMI() {
  const h = parseFloat(document.getElementById('height').value);
  const w = parseFloat(document.getElementById('weight').value);
  if (!h || !w || h <= 0 || w <= 0) { alert('Please enter valid height and weight.'); return; }

  const bmi = w / (h * h);
  const bmiRounded = Math.round(bmi * 10) / 10;

  let label, color, pct;
  if (bmi < 18.5) {
    label = "You're underweight — eat up, bhai!";
    color = "#378ADD";
    pct = Math.max(2, (bmi / 18.5) * 22);
  } else if (bmi <= 24.9) {
    label = "You're okay — solid range!";
    color = "#639922";
    pct = 22 + ((bmi - 18.5) / 6.4) * 28;
  } else if (bmi <= 29.9) {
    label = "Try to lose some weight";
    color = "#EF9F27";
    pct = 50 + ((bmi - 25) / 4.9) * 25;
  } else {
    label = "High BMI — time to act";
    color = "#E24B4A";
    pct = Math.min(97, 75 + ((bmi - 30) / 10) * 22);
  }

  document.getElementById('bmi-num').textContent = bmiRounded.toFixed(1);
  document.getElementById('bmi-num').style.color = color;
  document.getElementById('bmi-label').textContent = label;
  document.getElementById('bmi-label').style.color = color;

  const fill = document.getElementById('bar-fill');
  fill.style.width = pct + '%';
  fill.style.background = color;
  document.getElementById('bar-marker').style.left = pct + '%';

  const heightCm = Math.round(h * 100);
  document.getElementById('details').innerHTML = `
    <div class="detail-row"><span>Height</span><span>${heightCm} cm</span></div>
    <div class="detail-row"><span>Weight</span><span>${w} kg</span></div>
    <div class="detail-row"><span>BMI</span><span>${bmiRounded.toFixed(1)}</span></div>
  `;

  const card = document.getElementById('result');
  card.style.display = 'block';
}

document.getElementById('height').addEventListener('keydown', e => { if (e.key === 'Enter') calcBMI(); });
document.getElementById('weight').addEventListener('keydown', e => { if (e.key === 'Enter') calcBMI(); });
</script>
